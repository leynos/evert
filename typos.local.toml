# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
# Fixed tool, action, archive and environment names keep their published
# spelling. The shell diagnostic pattern includes source-level backslashes.
# Ordinary prose and unrelated identifiers remain checked.
ignore = [
  "CARGO_TERM_COLOR",
  "fuse-ld=mold",
  "install-mold",
  '(?m)^      # \.cargo/config\.toml links with clang and the mold linker on$',
  '(?m)^      # exactly as CI.*Install mold linker.*$',
  '(?m)^        sudo apt-get install --yes --no-install-recommends clang lld mold$',
  "mold-version:",
  '(?m)^            && sudo apt-get install --yes --no-install-recommends clang lld mold$',
  '(?m)^    let make_flags = "-Clink-arg=-Wl,--undefined=mold_init";$',
  '(?m)^            "flags=-D warnings -Clink-arg=-Wl,--undefined=mold_init\\n",$',
  '"mold-version"',
  "evert-clang-mold",
  'ld\.mold',
  "`mold`",
  '\x5c`mold\x5c`',
  '\$1 == "mold"',
  '(?m)^[ ]+linker_binary_version mold$',
  'mold-\$version-(?:\$\(linker_arch\)|\$arch)-linux\.tar\.gz',
  'mold-\{version\}-x86_64-linux\.tar\.gz',
  'mold-[0-9]+\.[0-9]+\.[0-9]+-(?:x86_64|aarch64)-linux\.tar\.gz',
  'tool_cache / "mold" /',
  'mold \{reported_version\}',
  "upload-artifact",
  '(?m)^[ ]+types: \[opened, reopened, synchronize, labeled, ready_for_review\]$',
  '(?m)^[ ]+"mold",$',
]

[files]
exclude = []
