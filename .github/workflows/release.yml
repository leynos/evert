
name: Release Binary

on:
  push:
    tags:
      - 'v*.*.*'

env:
  BIN_NAME: evert
  CROSS_REVISION: 88f49ff79e777bef6d3564531636ee4d3cc2f8d2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: windows
            arch: x86_64
            target: x86_64-pc-windows-gnu
            ext: ".exe"
          - os: macos
            arch: x86_64
            target: x86_64-apple-darwin
            ext: ""
          - os: macos
            arch: aarch64
            target: aarch64-apple-darwin
            ext: ""
          - os: freebsd
            arch: x86_64
            target: x86_64-unknown-freebsd
            ext: ""
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: leynos/shared-actions/.github/actions/setup-rust@fc0e10220207b951bf693aba2ce4f9dafc1a0206
        with:
          expect-cache: any
      - name: Cache cross binary
        id: cache-cross
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ env.CROSS_REVISION }}
      - name: Install cross
        env:
          # Cargo must not inherit the development linker flags.
          RUSTFLAGS: ""
        run: |
          if [ -x "$HOME/.cargo/bin/cross" ]; then
            exit 0
          fi
          env -u CARGO_ENCODED_RUSTFLAGS cargo install cross --git https://github.com/cross-rs/cross --rev "${CROSS_REVISION}"
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
      - name: Build release binary
        # Release builds use the pinned nightly from rust-toolchain.toml. The
        # release profile keeps the LLVM backend, the estate standard.
        env:
          # RUSTFLAGS replaces the parallel frontend and `mold` flags in
          # .cargo/config.toml; the command also removes any encoded flags
          # before Cross invokes rustc in its container.
          RUSTFLAGS: ""
        run: env -u CARGO_ENCODED_RUSTFLAGS cross build --release --target ${{ matrix.target }}
      - name: Prepare artefact
        run: |
          mkdir -p artefacts/${{ matrix.os }}-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }}${{ matrix.ext }} \
            artefacts/${{ matrix.os }}-${{ matrix.arch }}/${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}
          cd artefacts/${{ matrix.os }}-${{ matrix.arch }}
          sha256sum ${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }} > \
            ${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}.sha256
      - name: Upload release artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: artefacts/${{ matrix.os }}-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artefacts
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: |
            artefacts/*/*
