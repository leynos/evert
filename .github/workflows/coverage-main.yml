name: Coverage (main)

# Main owns both persistent coverage outputs: the ratchet baseline and the
# CodeScene upload. Pull requests generate coverage only for their own ratchet
# check, in ci.yml; they neither publish a report nor contact CodeScene, and
# the CV-005 contract tests under tests/workflow_contracts hold that shape.
#
# The CodeScene call is what moves here, not the artefact: the shared uploader
# pins the cs-coverage archive by digest, but the tool talks to CodeScene's API
# and refuses to run when that answer changes shape. Keeping the call on the
# trunk keeps such a change off every pull request's critical path.

on:
  push:
    branches: [main]
  # A dispatch measures on demand: merges made with the automerge workflow's
  # GITHUB_TOKEN fire no push event. A dispatch on main uploads a fresh report,
  # but the shared action writes a new baseline only on a push to
  # refs/heads/main, so the ratchet catches up at the next push. The upload
  # step below checks the ref, so a dispatch aimed at a branch publishes
  # nothing.
  workflow_dispatch:

# One group per ref, never cancelled. A cancelled run abandons both its upload
# and its baseline write. Runs in one group never overlap, and a newer trigger
# replaces an older pending run rather than queueing behind it. GitHub does not
# promise to start runs in trigger order, so this does not guarantee commit
# order. A manual re-run of an older run keeps its SHA and its run id: it
# republishes that commit's coverage to CodeScene, but replaces no ratchet
# baseline unless the original run saved none. The group is not keyed on the
# event, which would let a dispatch and a push to main run at once.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment rule holds it to
    # this job.
    environment: codescene
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@22c1a57865e42ba7e2ca4f88ae49fa6f81f58013
      - name: Install mold linker
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # mold accelerates dev builds; coverage uses lld for llvm-tools compatibility.
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Log coverage linker configuration
        run: |
          echo "Coverage linker: clang"
          echo "Coverage RUSTFLAGS: -C link-arg=-fuse-ld=lld"
          echo "Coverage CFLAGS: -fuse-ld=lld"
          echo "Coverage LDFLAGS: -fuse-ld=lld"
      # The selection is the baseline every pull request's ratchet is measured
      # against, so ci.yml's must match it field for field.
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@82feb2b7aac45b7efff40c9c4bb632551b14521c
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      # No env binds the token. The uploader is a composite action: a token in
      # its step's env would reach its nested upload-artifact and cache steps
      # too, and it binds the token itself from its access-token input. Actions
      # evaluates this expression to true or false before the shell runs, so a
      # fork without the secret skips the upload rather than failing it.
      - name: Check for the CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        # The ref check is what stops a dispatch from a branch uploading that
        # branch's coverage as the trunk's.
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@82feb2b7aac45b7efff40c9c4bb632551b14521c
        with:
          format: lcov
          path: lcov.info
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
