# Evert's Clippy configuration.
#
# Numeric thresholds align with the selected estate baseline. The
# disallowed-methods list is an explicit Evert local extension.
cognitive-complexity-threshold = 9     # default is 25
too-many-arguments-threshold = 4       # default is 7
too-many-lines-threshold = 70          # default is 100
excessive-nesting-threshold = 4        # default is off

allow-expect-in-tests = true

# Enforce environment injection at explicit boundaries. The reason strings
# tell contributors how to replace ambient environment access.
#
# Fix violations at source. The only sanctioned `#[expect]` uses are for
# verified macro-expansion artefacts and genuine floating-point arithmetic;
# each requires a reason and evidence. Never use `#[allow]` or an expectation
# to defer ordinary remediation.
disallowed-methods = [
  { path = "std::env::var", reason = "inject an environment reader" },
  { path = "std::env::var_os", reason = "inject an environment reader" },
  { path = "std::env::vars", reason = "inject an environment reader" },
  { path = "std::env::vars_os", reason = "inject an environment reader" },
  { path = "std::env::set_var", reason = "use a stub environment in tests" },
  { path = "std::env::remove_var", reason = "use a stub environment in tests" },
]
