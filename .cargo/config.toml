# Repository-wide Cargo defaults for Linux development builds. The generic
# target selector keeps the standard independent of Linux architecture; the
# Makefile restates the same flags when a recipe assigns RUSTFLAGS.
[target.'cfg(target_os = "linux")']
rustflags = ["-Zthreads=8", "-Clinker=evert-clang-mold", "-Clink-arg=-fuse-ld=mold"]

# Native Cargo metadata setting for dated nightlies from 2026-07-31 (rule
# `rust-dev-build-footprint`, DF-003): Cargo coordinates metadata output itself.
# Never use raw rustc metadata flags; they broke build scripts.
[unstable]
embed-metadata = false
