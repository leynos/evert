# Cargo configuration fragment that selects the Cranelift backend for the
# make targets' development builds.
#
# The build standard's flags (the parallel frontend and, on Linux, the mold
# linker) live in `.cargo/config.toml`, which Cargo discovers on its own. The
# backend cannot: the release workflow builds with `cross +stable build
# --release`, stable Cargo reads `.cargo/config.toml` too, and it refuses a
# `[profile.dev] codegen-backend` key ("config profile `dev` is not valid").
# So the backend lives here, passed explicitly with
# `cargo --config tools/dev-fast/config.toml ...` by the standard make targets,
# and never by coverage or release builds. See "The build standard" in
# docs/developers-guide.md.

[unstable]
codegen-backend = true

# Cranelift trades runtime performance for compile speed, so it applies to
# the dev profile only.
[profile.dev]
codegen-backend = "cranelift"
